# Rasters: OS Terrain 50 (heights of Great Britain on a 50 m grid), one Cloud-Optimised GeoTIFF
# in GeoServer's /data folder, published with a colour ramp. geodata-sync's examples/terrain
# makes the file from the OS download and keeps it up to date.
apiVersion: configops/v1alpha1
kind: Project
metadata:
  name: terrain
spec:
  geoserver:
    url: http://localhost:8080/geoserver
    credentials: { secret: geoserver-admin }
  workspace: terrain
  crs: EPSG:27700
---
apiVersion: configops/v1alpha1
kind: Store
metadata:
  name: terrain-50
spec:
  type: geotiff
  path: rasters/os-terrain-50.tif              # under /data: geodata-sync's examples/terrain makes it
---
apiVersion: configops/v1alpha1
kind: Layer
metadata:
  name: heights
spec:
  store: terrain-50
  title: Heights of Great Britain (OS Terrain 50)
  attribution: Contains OS data © Crown copyright and database right 2026   # OS OpenData's licence asks for it
  style: elevation
  cache: true
