# Rasters: OS Terrain 50 (heights of Great Britain on a 50 m grid) made into one
# Cloud-Optimised GeoTIFF on the shared data volume, and published with a colour ramp.
# Needs the data volume: deploy with -f values-data-volume.yaml.
apiVersion: gisdata/v1alpha1
kind: Project
metadata:
  name: terrain
spec:
  geoserver:
    url: http://geoserver-gsc-gateway:8080/geoserver-cloud
    credentials: { secret: geoserver-admin }
  database:                                    # the ingest log lives here
    jndi: java:comp/env/jdbc/mypostgis
    connection: { secret: geoserver-pgconfig-secret }
  workspace: terrain
  crs: EPSG:27700
  backups: 1
---
apiVersion: gisdata/v1alpha1
kind: Source
metadata:
  name: os
spec:
  type: os-downloads
---
# The ASCII Grid download: about 2,800 tiles in zips inside a zip, mosaicked into one file
apiVersion: gisdata/v1alpha1
kind: Dataset
metadata:
  name: terrain-50
spec:
  source: os
  product: Terrain50
  update: monthly
  raster:
    path: rasters/os-terrain-50.tif
    crs: EPSG:27700                            # the grids carry no CRS of their own
---
apiVersion: gisdata/v1alpha1
kind: Store
metadata:
  name: terrain-50
spec:
  type: geotiff
  dataset: terrain-50                          # the Dataset's file
---
apiVersion: gisdata/v1alpha1
kind: Layer
metadata:
  name: heights
spec:
  store: terrain-50
  title: Heights of Great Britain (OS Terrain 50)
  style: elevation
  cache: true
