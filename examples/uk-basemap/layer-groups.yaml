# A basemap drawn as one layer, and a folder that groups it with other layers.
apiVersion: gisdata/v1alpha1
kind: LayerGroup
metadata:
  name: uk-basemap
spec:
  title: UK basemap
  abstract: Counties and roads from OS OpenData.
  mode: single
  layers:                       # drawn in this order: first at the bottom
    - counties
    - road-links
    - { layer: road-nodes, style: os-road-node }
  cache: true
---
apiVersion: gisdata/v1alpha1
kind: LayerGroup
metadata:
  name: os-opendata
spec:
  title: OS OpenData
  mode: container
  layers:
    - uk-basemap
    - survey-sites
---
# Tiles on British National Grid, as OS's own maps use: the same origin and zoom levels
apiVersion: gisdata/v1alpha1
kind: Gridset
metadata:
  name: british-national-grid
spec:
  crs: EPSG:27700
  extent: [-238375, 0, 900000, 1376256]
  resolutions: [896, 448, 224, 112, 56, 28, 14, 7, 3.5, 1.75, 0.875, 0.4375, 0.21875, 0.109375]
