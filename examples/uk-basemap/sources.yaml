apiVersion: gisdata/v1alpha1
kind: Source
metadata:
  name: os
spec:
  type: os-downloads
  credentials: { secret: os-api }   # key: apiKey (OS Data Hub key; optional, OpenData needs none)
---
apiVersion: gisdata/v1alpha1
kind: Source
metadata:
  name: data-gov-uk
spec:
  type: ckan
  url: https://data.gov.uk          # any CKAN portal; public data needs no key
---
apiVersion: gisdata/v1alpha1
kind: Source
metadata:
  name: ea-flood-map
spec:
  type: ogc-api-features            # the Environment Agency's flood map, as an OGC API
  url: https://environment.data.gov.uk/spatialdata/flood-map-for-planning-flood-zones/ogc/features/v1
