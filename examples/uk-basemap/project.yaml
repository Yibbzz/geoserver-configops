# The GeoServer and database this directory manages, and defaults for everything else.
apiVersion: configops/v1alpha1
kind: Project
metadata:
  name: uk-basemap
spec:
  geoserver:
    url: http://localhost:8080/geoserver
    credentials: { secret: geoserver-admin }
  database:
    jndi: java:comp/env/jdbc/mypostgis
    connection: { secret: database }
    schema: data_layers                            # where the layers' tables are (geodata-sync loads them)
  workspace: uk
  crs: EPSG:27700
