# Surrey Heath conservation areas from data.gov.uk, a CKAN portal. The package
# has the same data as Shapefile, GeoJSON, GML and GeoPackage; `resource` pins
# the GeoPackage. `gisdata discover data-gov-uk conservation-areas125` lists
# them, and the one layer inside: conservation_areas.
apiVersion: gisdata/v1alpha1
kind: Dataset
metadata:
  name: conservation-areas
spec:
  source: data-gov-uk
  product: conservation-areas125
  resource: 9dd40b81-62f5-4c75-b1cd-d200af101632
  update: monthly
  tables:
    conservation_areas: { name: conservation_areas }
---
apiVersion: gisdata/v1alpha1
kind: Layer
metadata:
  name: conservation-areas
spec:
  dataset: conservation-areas
  table: conservation_areas
  title: Conservation areas (Surrey Heath)
  style: polygon
