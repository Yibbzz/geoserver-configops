# Flood zones 2 and 3 (rivers and sea): the Environment Agency's GeoPackage
# download (about 1 GB) on data.gov.uk. `gisdata discover data-gov-uk
# flood-map-for-planning-flood-zones1` shows the package; the layer inside is
# loaded as table flood_zones. Not the EA's OGC API: paging 415k features
# through it takes hours and its server drops pages (504s, broken connections).
apiVersion: gisdata/v1alpha1
kind: Dataset
metadata:
  name: flood-zones
spec:
  source: data-gov-uk
  product: flood-map-for-planning-flood-zones1
  update: monthly
  tables:
    Flood_Zones_2_3_Rivers_and_Sea: { name: flood_zones }
---
apiVersion: gisdata/v1alpha1
kind: Layer
metadata:
  name: flood-zones
spec:
  dataset: flood-zones
  table: Flood_Zones_2_3_Rivers_and_Sea
  title: Flood zones 2 and 3, rivers and sea (Environment Agency)
  style: polygon
