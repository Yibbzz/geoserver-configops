# OS Open Roads: road links and nodes from the GeoPackage, each published with its own style.
# `configops discover os OpenRoads` lists its layers; motorway_junction is left out here.
apiVersion: configops/v1alpha1
kind: Dataset
metadata:
  name: os-open-roads
spec:
  source: os
  product: OpenRoads
  update: weekly
  tables:
    road_link: {}
    road_node: {}
---
apiVersion: configops/v1alpha1
kind: Layer
metadata:
  name: road-links
spec:
  dataset: os-open-roads
  table: road_link
  title: OS Open Roads, road links
  style: os-road-link
  cache:
    gridsets: [EPSG:900913, british-national-grid]   # web maps, and British National Grid (layer-groups.yaml)
---
apiVersion: configops/v1alpha1
kind: Layer
metadata:
  name: road-nodes
spec:
  dataset: os-open-roads
  table: road_node
  title: OS Open Roads, junctions
  style: os-road-node
