# OS Boundary-Line: every table in the product is loaded (no `tables`); one is published.
# `configops discover os BoundaryLine` lists its 18 layers.
apiVersion: configops/v1alpha1
kind: Dataset
metadata:
  name: boundary-line
spec:
  source: os
  product: BoundaryLine
  update: monthly
---
apiVersion: configops/v1alpha1
kind: Layer
metadata:
  name: counties
spec:
  dataset: boundary-line
  table: county
  title: Counties (OS Boundary-Line)
  style: polygon
