# OS Boundary-Line: every table in the product is loaded (no `tables`); one is published.
# The table name is to be confirmed with `gisdata discover os BoundaryLine`.
apiVersion: gisdata/v1alpha1
kind: Dataset
metadata:
  name: boundary-line
spec:
  source: os
  product: BoundaryLine
  update: monthly
---
apiVersion: gisdata/v1alpha1
kind: Layer
metadata:
  name: counties
spec:
  dataset: boundary-line
  table: county
  title: Counties (OS Boundary-Line)
  style: polygon
