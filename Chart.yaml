apiVersion: v2
description: A Helm chart for Geoserver-cloud
name: geoservercloud
version: 0.1.0
dependencies:
  - name: application
    repository: https://camptocamp.github.io/helm-application/
    alias: geoserver
    version: 2.19.0
  - name: rabbitmq
    version: 14.4.0
    repository: oci://ghcr.io/georchestra/bitnami-helm-charts
    condition: rabbitmq.enabled
  - name: postgresql
    version: 15.5.2
    repository: oci://ghcr.io/georchestra/bitnami-helm-charts
    condition: postgresql.enabled