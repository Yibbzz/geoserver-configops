# auth-sidecar.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geoserver-auth-sidecar
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: geoserver-auth-sidecar
  template:
    metadata:
      labels:
        app: geoserver-auth-sidecar
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: sidecar
          image: k3d-k3d-registry.localhost:5000/geoserver-auth-sidecar:latest
          ports:
            - containerPort: 8081
          volumeMounts:
            - name: policy
              mountPath: /etc/policy
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 10
            initialDelaySeconds: 5
          resources:
            requests:
              memory: 64Mi
              cpu: 0.05
            limits:
              memory: 128Mi
              cpu: 0.5
      volumes:
        - name: policy
          configMap:
            name: geoserver-layer-policy
---
apiVersion: v1
kind: Service
metadata:
  name: geoserver-auth-sidecar
  namespace: default
spec:
  selector:
    app: geoserver-auth-sidecar
  ports:
    - port: 8081
      targetPort: 8081