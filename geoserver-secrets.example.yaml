# Example secrets. Copy to geoserver-secrets.yaml (git-ignored), fill in, then:
#   kubectl apply -f geoserver-secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: geoserver-pgconfig-secret
type: Opaque
stringData:
  host: "geoserver-postgresql"
  port: "5432"
  database: "postgres"
  schema: "pgconfig"
  username: "postgres"
  password: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: geoserver-rabbitmq-secret
type: Opaque
stringData:
  password: "CHANGE_ME"
  username: "user"
---
apiVersion: v1
kind: Secret
metadata:
  name: geoserver-ingest-secret
type: Opaque
stringData:
  os-api-key: ""  # https://osdatahub.os.uk/ (free OS Data Hub project key)
