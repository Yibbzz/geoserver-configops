# Example secrets. Copy to geoserver-secrets.yaml (git-ignored), fill in, then:
#   kubectl apply -f geoserver-secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: geoserver-pgconfig-secret
type: Opaque
stringData:
  host: "geoserver-postgresql"
  port: "5432"
  database: "postgres"
  schema: "pgconfig"
  username: "postgres"
  password: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: geoserver-rabbitmq-secret
type: Opaque
stringData:
  password: "CHANGE_ME"
  username: "user"
---
apiVersion: v1
kind: Secret
metadata:
  name: geoserver-admin  # GeoServer's admin login, for configops (the nightly sync refreshes layers with it)
type: Opaque
stringData:
  username: "admin"
  password: "CHANGE_ME"  # GeoServer's admin password, once changed from the default
---
apiVersion: v1
kind: Secret
metadata:
  name: os-api  # named by the os Source in the configops project; optional, OpenData needs no key
type: Opaque
stringData:
  apiKey: ""  # https://osdatahub.os.uk/ (free OS Data Hub project key)
