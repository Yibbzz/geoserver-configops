tolerations: []
podSecurityContext: {}
securityContext: {}

common-image-stuff: &common-image-stuff
  tag: '2.28.2.3'

service: &common-service-definition
  type: ClusterIP
  servicePort: 8080
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http

volumes: &common-volumes
  vol-local-gscloud:
    emptyDir: {}
  tmp-empty-dir:
    emptyDir: {}
  vol-data-dir:
    persistentVolumeClaim:
      claimName: geoserver-datadir-pvc

volumeMounts: &common-volume-mounts
  /etc/localconfig:
    name: vol-local-gscloud
  # /tmp as emptyDir, required if running with readOnlyRootFilesystem=true
  /tmp/:
    name: 'tmp-empty-dir'
  # data_directory as emptyDir, required if running with readOnlyRootFilesystem=true
  /opt/app/data_directory:
    name: vol-data-dir

ports: &common-ports
  http:
    containerPort: 8080
    hostIP: 127.0.0.1
  health:
    containerPort: 8081
    hostIP: 127.0.0.1

rabbitmq:
  enabled: true
  auth:
    username: user
    password: 'guest'
  resources:
    limits:
      cpu: 1
      memory: 256Mi
    requests:
      cpu: 0.1
      memory: 120Mi
  image:
    registry: docker.io
    repository: bitnamilegacy/rabbitmq

postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    #image: 16.3.0-debian-12-r12
  global:
    postgresql:
      auth:
        # this should be replaced by your existing secret
        # existingSecret: your-secret-name
        postgresPassword: g30s3rv3r
  primary:
    initdb:
      # install postgis extension (used by geoserver-acl)
      scriptsConfigMap: install-postgis-configmap

resources: &common-resources
  requests:
    memory: 256Mi
    cpu: 0.1
  limits:
    memory: 768Mi
    cpu: 4.0

env: &common-env
  GEOSERVER_BASE_PATH:
    # NB: do not put a trailing '/' character
    value: '/geoserver-cloud'
  SPRING_PROFILES_ACTIVE:
    # this must be explicitly overridden with either
    # "standalone,jdbcconfig,kube" or "standalone,datadir,kube"
    value: standalone,datadir,kube
  GWC_ENABLED:
    value: 'true'
  JAVA_OPTS_DEFAULT:
    value: '-DALLOW_ENV_PARAMETRIZATION=true -XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=25'
  JAVA_OPTS:
    order: 1
    value: '$(JAVA_OPTS_DEFAULT)'
  GEOTOOLS_HTTPCLIENT_PROXY_ENABLED:
    value: 'false'
  APP_KUBERNETES_IO_INSTANCE:
    type: 'valueFrom'
    valueFrom:
      fieldRef:
        fieldPath: "metadata.labels['app.kubernetes.io/instance']"
  APP_KUBERNETES_IO_NAME:
    type: 'valueFrom'
    valueFrom:
      fieldRef:
        fieldPath: "metadata.labels['app.kubernetes.io/name']"
  APP_KUBERNETES_IO_COMPONENT:
    type: 'valueFrom'
    valueFrom:
      fieldRef:
        fieldPath: "metadata.labels['app.kubernetes.io/component']"
  SERVICE_GATEWAY_NAME:
    type: 'configMap'
    name: self-metadata
    key: SERVICE_GATEWAY_NAME
  SERVICE_GWC_NAME:
    type: 'configMap'
    name: self-metadata
    key: SERVICE_GWC_NAME
  SERVICE_REST_NAME:
    type: 'configMap'
    name: self-metadata
    key: SERVICE_REST_NAME
  SERVICE_WCS_NAME:
    type: 'configMap'
    name: self-metadata
    key: SERVICE_WCS_NAME
  SERVICE_WEBUI_NAME:
    type: 'configMap'
    name: self-metadata
    key: SERVICE_WEBUI_NAME
  SERVICE_WFS_NAME:
    type: 'configMap'
    name: self-metadata
    key: SERVICE_WFS_NAME
  SERVICE_WMS_NAME:
    type: 'configMap'
    name: self-metadata
    key: SERVICE_WMS_NAME
  SERVICE_WPS_NAME:
    type: 'configMap'
    name: self-metadata
    key: SERVICE_WPS_NAME
  SERVICE_ACL_NAME:
    type: 'configMap'
    name: self-metadata
    key: SERVICE_ACL_NAME
  TARGETS_WMS:
    order: 1
    value: 'http://$(SERVICE_WMS_NAME):8080'
  TARGETS_WFS:
    order: 1
    value: 'http://$(SERVICE_WFS_NAME):8080'
  TARGETS_WPS:
    order: 1
    value: 'http://$(SERVICE_WPS_NAME):8080'
  TARGETS_WCS:
    order: 1
    value: 'http://$(SERVICE_WCS_NAME):8080'
  TARGETS_GWC:
    order: 1
    value: 'http://$(SERVICE_GWC_NAME):8080'
  TARGETS_REST:
    order: 1
    value: 'http://$(SERVICE_REST_NAME):8080'
  TARGETS_WEBUI:
    order: 1
    value: 'http://$(SERVICE_WEBUI_NAME):8080'
  TARGETS_ACL:
    order: 1
    value: 'http://$(SERVICE_ACL_NAME):8080'
  ACL_URL:
    order: 1
    value: 'http://$(SERVICE_ACL_NAME):8080/acl/api'
  ACL_USERNAME:
    value: 'geoserver'
  SPRING_RABBITMQ_HOST:
    value: 'geoserver-rabbitmq'
  SPRING_RABBITMQ_PORT:
    value: '5672'
  SPRING_RABBITMQ_USERNAME:
    value: 'user'
  SPRING_RABBITMQ_PASSWORD:
    value: 'guest'

common-spring-container-stuff: &common-spring-container-stuff
  resources:
    <<: *common-resources
  ports:
    <<: *common-ports
  volumeMounts:
    <<: *common-volume-mounts
  env:
    <<: *common-env

geoserver-spring-livenessProbe: &geoserver-spring-livenessProbe
  httpGet:
    path: /actuator/health/liveness
    port: health
  periodSeconds: 10
  failureThreshold: 10
  initialDelaySeconds: 120
geoserver-spring-readinessProbe: &geoserver-spring-readinessProbe
  httpGet:
    path: /actuator/health/readiness
    port: health
  periodSeconds: 5

common-generic-stuff: &common-generic-stuff
  releaseTrunc: 45
  prefixTrunc: 51
  template: true
  replicaCount: 1
  nameOverride: 'gsc'
  initContainers: {}
    #<<: *common-init-containers
  nodeSelector: {}
  affinity: {}

geoserver:
  metadata:
    enabled: true
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
  ingress:
    enabled: true
    hostGroups:
      host1:
        tls:
          enabled: false
        hosts:
          - gscloud.local
    # For example #
    # hostGroups:
    #   host1:
    #     tls:
    #       enabled: false
    #       secretName: 'my-tls-secret'
    #     hosts:
    #       - one.example.com
    #       - two.example.com
    #   host2:
    #     tls:
    #       enabled: true
    #       secretName: 'my-wildcard-tls-secret'
    #     hosts:
    #       - '*.example.com'

  serviceAccount:
    # Specifies whether a service account should be created
    create: false
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: default
  services:
    gateway:
      enabled: true
      ingress:
        # NB: if .Values.gscloud.ingress.enabled=true put true here as well
        enabled: true
        path: /geoserver-cloud/
      <<: *common-generic-stuff
      service:
        <<: *common-service-definition
      volumes:
        <<: *common-volumes
      containers:
        spring:
          <<: *common-spring-container-stuff
          livenessProbe:
            <<: *geoserver-spring-livenessProbe
          readinessProbe:
            <<: *geoserver-spring-readinessProbe
          image:
            <<: *common-image-stuff
            repository: geoservercloud/geoserver-cloud-gateway
            sha: ''
    webui:
      enabled: true
      ingress:
        enabled: false
      <<: *common-generic-stuff
      service:
        <<: *common-service-definition
      volumes:
        <<: *common-volumes
      containers:
        spring:
          <<: *common-spring-container-stuff
          livenessProbe:
            <<: *geoserver-spring-livenessProbe
          readinessProbe:
            <<: *geoserver-spring-readinessProbe
          image:
            <<: *common-image-stuff
            repository: geoservercloud/geoserver-cloud-webui
            sha: ''
    rest:
      enabled: true
      ingress:
        enabled: false
      <<: *common-generic-stuff
      service:
        <<: *common-service-definition
      volumes:
        <<: *common-volumes
      containers:
        spring:
          <<: *common-spring-container-stuff
          livenessProbe:
            <<: *geoserver-spring-livenessProbe
          readinessProbe:
            <<: *geoserver-spring-readinessProbe
          image:
            <<: *common-image-stuff
            repository: geoservercloud/geoserver-cloud-rest
            sha: ''
    wfs:
      enabled: true
      ingress:
        enabled: false
      <<: *common-generic-stuff
      service:
        <<: *common-service-definition
      volumes:
        <<: *common-volumes
      containers:
        spring:
          <<: *common-spring-container-stuff
          livenessProbe:
            <<: *geoserver-spring-livenessProbe
          readinessProbe:
            <<: *geoserver-spring-readinessProbe
          image:
            <<: *common-image-stuff
            repository: geoservercloud/geoserver-cloud-wfs
            sha: ''
    wms:
      enabled: true
      ingress:
        enabled: false
      <<: *common-generic-stuff
      service:
        <<: *common-service-definition
      volumes:
        <<: *common-volumes
      containers:
        spring:
          <<: *common-spring-container-stuff
          livenessProbe:
            <<: *geoserver-spring-livenessProbe
          readinessProbe:
            <<: *geoserver-spring-readinessProbe
          image:
            <<: *common-image-stuff
            repository: geoservercloud/geoserver-cloud-wms
            sha: ''
    wcs:
      enabled: true
      ingress:
        enabled: false
      <<: *common-generic-stuff
      service:
        <<: *common-service-definition
      volumes:
        <<: *common-volumes
      containers:
        spring:
          <<: *common-spring-container-stuff
          livenessProbe:
            <<: *geoserver-spring-livenessProbe
          readinessProbe:
            <<: *geoserver-spring-readinessProbe
          image:
            <<: *common-image-stuff
            repository: geoservercloud/geoserver-cloud-wcs
            sha: ''
    wps:
      enabled: false
      ingress:
        enabled: false
      <<: *common-generic-stuff
      service:
        <<: *common-service-definition
      volumes:
        <<: *common-volumes
      containers:
        spring:
          <<: *common-spring-container-stuff
          livenessProbe:
            <<: *geoserver-spring-livenessProbe
          readinessProbe:
            <<: *geoserver-spring-readinessProbe
          image:
            <<: *common-image-stuff
            repository: geoservercloud/geoserver-cloud-wps
            sha: ''
    gwc:
      enabled: true
      ingress:
        enabled: false
      <<: *common-generic-stuff
      service:
        <<: *common-service-definition
      volumes:
        <<: *common-volumes
      containers:
        spring:
          <<: *common-spring-container-stuff
          livenessProbe:
            <<: *geoserver-spring-livenessProbe
          readinessProbe:
            <<: *geoserver-spring-readinessProbe
          image:
            <<: *common-image-stuff
            repository: geoservercloud/geoserver-cloud-gwc
            sha: ''
    acl:
      enabled: false
      ingress:
        enabled: false
      <<: *common-generic-stuff
      service:
        <<: *common-service-definition
      volumes:
        <<: *common-volumes
      containers:
        spring:
          <<: *common-spring-container-stuff
          env:
            GEOSERVER_BUS_ENABLED:
              value: 'true'
            PG_HOST:
              value: 'acldb'
            PG_PORT:
              value: '5432'
            PG_DB:
              value: 'acl'
            PG_SCHEMA:
              value: 'acl'
            PG_USERNAME:
              value: 'acl'
          image:
            tag: '2.4.0'
            repository: geoservercloud/geoserver-acl
            sha: ''