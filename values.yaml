tolerations: []
podSecurityContext: {}
securityContext: {}

common-image-stuff: &common-image-stuff
  tag: '2.28.2.3'

service: &common-service-definition
  type: ClusterIP
  servicePort: 8080
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http

volumes: &common-volumes
  vol-local-gscloud:
    emptyDir: {}
  tmp-empty-dir:
    emptyDir: {}
  vol-gwc-cache:
    emptyDir: {}
  vol-jndi-config:                    
    configMap:
      name: geoserver-jndi-config

volumeMounts: &common-volume-mounts
  /etc/localconfig:
    name: vol-local-gscloud
  /tmp/:
    name: 'tmp-empty-dir'
  /opt/app/data_directory:
    name: vol-gwc-cache
  /etc/geoserver/jndi.yml:            
    name: vol-jndi-config
    subPath: jndi.yml

GEOWEBCACHE_CACHE_DIR:
  value: '/tmp/gwc'

ports: &common-ports
  http:
    containerPort: 8080
  health:
    containerPort: 8081

rabbitmq:
  enabled: true
  auth:
    username: user
    existingPasswordSecret: geoserver-rabbitmq-secret 
  resources:
    limits:
      cpu: 1
      memory: 256Mi
    requests:
      cpu: 0.1
      memory: 120Mi
  image:
    registry: docker.io
    repository: bitnamilegacy/rabbitmq

postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
  global:
    postgresql:
      auth:
        existingSecret: geoserver-pgconfig-secret
        secretKeys:
          adminPasswordKey: password
  primary:
    initdb:
      scriptsConfigMap: install-postgis-configmap
    resources:
      requests:
        memory: 512Mi
        cpu: 0.2
      limits:
        memory: 2Gi
        cpu: 2.0

resources: &common-resources
  requests:
    memory: 256Mi
    cpu: 0.1
  limits:
    memory: 768Mi
    cpu: 4.0

env: &common-env
  SPRING_CONFIG_ADDITIONAL_LOCATION:
    value: 'file:/etc/geoserver/jndi.yml'
  GEOSERVER_BASE_PATH:
    value: '/geoserver-cloud'
  SPRING_PROFILES_ACTIVE:
    value: standalone,pgconfig,kube
  GWC_ENABLED:
    value: 'true'
  JAVA_OPTS_DEFAULT:
    value: '-DALLOW_ENV_PARAMETRIZATION=true -XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=25'
  JAVA_OPTS:
    order: 1
    value: '$(JAVA_OPTS_DEFAULT)'
  GEOTOOLS_HTTPCLIENT_PROXY_ENABLED:
    value: 'false'
  PGCONFIG_HOST:
    type: 'valueFrom'
    valueFrom:
      secretKeyRef:
        name: geoserver-pgconfig-secret
        key: host
  PGCONFIG_PORT:
    type: 'valueFrom'
    valueFrom:
      secretKeyRef:
        name: geoserver-pgconfig-secret
        key: port
  PGCONFIG_DATABASE:
    type: 'valueFrom'
    valueFrom:
      secretKeyRef:
        name: geoserver-pgconfig-secret
        key: database
  PGCONFIG_SCHEMA:
    type: 'valueFrom'
    valueFrom:
      secretKeyRef:
        name: geoserver-pgconfig-secret
        key: schema
  PGCONFIG_USERNAME:
    type: 'valueFrom'
    valueFrom:
      secretKeyRef:
        name: geoserver-pgconfig-secret
        key: username
  PGCONFIG_PASSWORD:
    type: 'valueFrom'
    valueFrom:
      secretKeyRef:
        name: geoserver-pgconfig-secret
        key: password
  PGCONFIG_INITIALIZE:
    value: 'true'
  APP_KUBERNETES_IO_INSTANCE:
    type: 'valueFrom'
    valueFrom:
      fieldRef:
        fieldPath: "metadata.labels['app.kubernetes.io/instance']"
  APP_KUBERNETES_IO_NAME:
    type: 'valueFrom'
    valueFrom:
      fieldRef:
        fieldPath: "metadata.labels['app.kubernetes.io/name']"
  APP_KUBERNETES_IO_COMPONENT:
    type: 'valueFrom'
    valueFrom:
      fieldRef:
        fieldPath: "metadata.labels['app.kubernetes.io/component']"
  SERVICE_GATEWAY_NAME:
    type: 'configMap'
    name: self-metadata
    key: SERVICE_GATEWAY_NAME
  SERVICE_GWC_NAME:
    type: 'configMap'
    name: self-metadata
    key: SERVICE_GWC_NAME
  SERVICE_REST_NAME:
    type: 'configMap'
    name: self-metadata
    key: SERVICE_REST_NAME
  SERVICE_WCS_NAME:
    type: 'configMap'
    name: self-metadata
    key: SERVICE_WCS_NAME
  SERVICE_WEBUI_NAME:
    type: 'configMap'
    name: self-metadata
    key: SERVICE_WEBUI_NAME
  SERVICE_WFS_NAME:
    type: 'configMap'
    name: self-metadata
    key: SERVICE_WFS_NAME
  SERVICE_WMS_NAME:
    type: 'configMap'
    name: self-metadata
    key: SERVICE_WMS_NAME
  SERVICE_WPS_NAME:
    type: 'configMap'
    name: self-metadata
    key: SERVICE_WPS_NAME
  SERVICE_ACL_NAME:
    type: 'configMap'
    name: self-metadata
    key: SERVICE_ACL_NAME
  TARGETS_WMS:
    order: 1
    value: 'http://$(SERVICE_WMS_NAME):8080'
  TARGETS_WFS:
    order: 1
    value: 'http://$(SERVICE_WFS_NAME):8080'
  TARGETS_WPS:
    order: 1
    value: 'http://$(SERVICE_WPS_NAME):8080'
  TARGETS_WCS:
    order: 1
    value: 'http://$(SERVICE_WCS_NAME):8080'
  TARGETS_GWC:
    order: 1
    value: 'http://$(SERVICE_GWC_NAME):8080'
  TARGETS_REST:
    order: 1
    value: 'http://$(SERVICE_REST_NAME):8080'
  TARGETS_WEBUI:
    order: 1
    value: 'http://$(SERVICE_WEBUI_NAME):8080'
  TARGETS_ACL:
    order: 1
    value: 'http://$(SERVICE_ACL_NAME):8080'
  ACL_URL:
    order: 1
    value: 'http://$(SERVICE_ACL_NAME):8080/acl/api'
  ACL_USERNAME:
    value: 'geoserver'
  SPRING_RABBITMQ_HOST:
    value: 'geoserver-rabbitmq'
  SPRING_RABBITMQ_PORT:
    value: '5672'
  SPRING_RABBITMQ_USERNAME:
    type: 'valueFrom'
    valueFrom:
      secretKeyRef:
        name: geoserver-rabbitmq-secret
        key: username
  SPRING_RABBITMQ_PASSWORD:
    type: 'valueFrom'
    valueFrom:
      secretKeyRef:
        name: geoserver-rabbitmq-secret
        key: password

common-spring-container-stuff: &common-spring-container-stuff
  resources:
    <<: *common-resources
  ports:
    <<: *common-ports
  volumeMounts:
    <<: *common-volume-mounts
  env:
    <<: *common-env

geoserver-spring-livenessProbe: &geoserver-spring-livenessProbe
  httpGet:
    path: /actuator/health/liveness
    port: health
  periodSeconds: 10
  failureThreshold: 10
  initialDelaySeconds: 120
geoserver-spring-readinessProbe: &geoserver-spring-readinessProbe
  httpGet:
    path: /actuator/health/readiness
    port: health
  periodSeconds: 5

common-generic-stuff: &common-generic-stuff
  releaseTrunc: 45
  prefixTrunc: 51
  template: true
  replicaCount: 1
  nameOverride: 'gsc'
  initContainers: {}
    #<<: *common-init-containers
  nodeSelector: {}
  affinity: {}

geoserver:
  metadata:
    enabled: true
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
  ingress:
    enabled: true
    hostGroups:
      host1:
        tls:
          enabled: false
        hosts:
          - gscloud.local

  serviceAccount:
    # Specifies whether a service account should be created
    create: false
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: default
  services:
    gateway:
      enabled: true
      ingress:
        enabled: true
        path: /geoserver-cloud/
      <<: *common-generic-stuff
      service:
        <<: *common-service-definition
      volumes:
        <<: *common-volumes
      containers:
        spring:
          <<: *common-spring-container-stuff
          livenessProbe:
            <<: *geoserver-spring-livenessProbe
          readinessProbe:
            <<: *geoserver-spring-readinessProbe
          image:
            <<: *common-image-stuff
            repository: docker.io/geoservercloud/geoserver-cloud-gateway
            sha: ''
    webui:
      enabled: true
      ingress:
        enabled: false
      <<: *common-generic-stuff
      service:
        <<: *common-service-definition
      volumes:
        <<: *common-volumes
      containers:
        spring:
          <<: *common-spring-container-stuff
          livenessProbe:
            <<: *geoserver-spring-livenessProbe
          readinessProbe:
            <<: *geoserver-spring-readinessProbe
          image:
            <<: *common-image-stuff
            repository: docker.io/geoservercloud/geoserver-cloud-webui
            sha: ''
    rest:
      enabled: true
      ingress:
        enabled: false
      <<: *common-generic-stuff
      service:
        <<: *common-service-definition
      volumes:
        <<: *common-volumes
      containers:
        spring:
          <<: *common-spring-container-stuff
          livenessProbe:
            <<: *geoserver-spring-livenessProbe
          readinessProbe:
            <<: *geoserver-spring-readinessProbe
          image:
            <<: *common-image-stuff
            repository: docker.io/geoservercloud/geoserver-cloud-rest
            sha: ''
    wfs:
      enabled: true
      ingress:
        enabled: false
      <<: *common-generic-stuff
      service:
        <<: *common-service-definition
      volumes:
        <<: *common-volumes
      containers:
        spring:
          <<: *common-spring-container-stuff
          livenessProbe:
            <<: *geoserver-spring-livenessProbe
          readinessProbe:
            <<: *geoserver-spring-readinessProbe
          image:
            <<: *common-image-stuff
            repository: docker.io/geoservercloud/geoserver-cloud-wfs
            sha: ''
    wms:
      enabled: true
      hpa:
        enabled: false
        minReplicas: 1
        maxReplicas: 16
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 70
      ingress:
        enabled: false
      <<: *common-generic-stuff
      service:
        <<: *common-service-definition
      volumes:
        <<: *common-volumes
      containers:
        spring:
          <<: *common-spring-container-stuff
          livenessProbe:
            <<: *geoserver-spring-livenessProbe
          readinessProbe:
            <<: *geoserver-spring-readinessProbe
          image:
            <<: *common-image-stuff
            repository: docker.io/geoservercloud/geoserver-cloud-wms
            sha: ''
    wcs:
      enabled: true
      ingress:
        enabled: false
      <<: *common-generic-stuff
      service:
        <<: *common-service-definition
      volumes:
        <<: *common-volumes
      containers:
        spring:
          <<: *common-spring-container-stuff
          livenessProbe:
            <<: *geoserver-spring-livenessProbe
          readinessProbe:
            <<: *geoserver-spring-readinessProbe
          image:
            <<: *common-image-stuff
            repository: docker.io/geoservercloud/geoserver-cloud-wcs
            sha: ''
    wps:
      enabled: false
      ingress:
        enabled: false
      <<: *common-generic-stuff
      service:
        <<: *common-service-definition
      volumes:
        <<: *common-volumes
      containers:
        spring:
          <<: *common-spring-container-stuff
          livenessProbe:
            <<: *geoserver-spring-livenessProbe
          readinessProbe:
            <<: *geoserver-spring-readinessProbe
          image:
            <<: *common-image-stuff
            repository: docker.io/geoservercloud/geoserver-cloud-wps
            sha: ''
    gwc:
      enabled: true
      ingress:
        enabled: false
      <<: *common-generic-stuff
      service:
        <<: *common-service-definition
      volumes:
        <<: *common-volumes
      containers:
        spring:
          <<: *common-spring-container-stuff
          livenessProbe:
            <<: *geoserver-spring-livenessProbe
          readinessProbe:
            <<: *geoserver-spring-readinessProbe
          image:
            <<: *common-image-stuff
            repository: docker.io/geoservercloud/geoserver-cloud-gwc
            sha: ''
    acl:
      enabled: false
      ingress:
        enabled: false
      <<: *common-generic-stuff
      service:
        <<: *common-service-definition
      volumes:
        <<: *common-volumes
      containers:
        spring:
          <<: *common-spring-container-stuff
          env:
            GEOSERVER_BUS_ENABLED:
              value: 'true'
            PG_HOST:
              value: 'acldb'
            PG_PORT:
              value: '5432'
            PG_DB:
              value: 'acl'
            PG_SCHEMA:
              value: 'acl'
            PG_USERNAME:
              value: 'acl'
          image:
            tag: '2.4.0'
            repository: docker.io/geoservercloud/geoserver-acl
            sha: ''
# Nightly open data ingest job (templates/ingest-cronjob.yaml).
# Needs the geoserver-ingest-secret secret (see geoserver-secrets.example.yaml).
ingest:
  enabled: true
  schedule: '0 2 * * *'
  image:
    repository: geoserver-ingest  # build from auto-update-development/Dockerfile and push to your registry
    tag: latest
    pullPolicy: Always
  prodSchema: data_layers
  stagingSchema: staging
  backupSchema: backup
  backupRetention: 3  # timestamped backups kept per dataset
