tolerations: []
podSecurityContext: {}
securityContext: {}

common-image-stuff: &common-image-stuff
  tag: '3.0.2.1'

service: &common-service-definition
  type: ClusterIP
  servicePort: 8080
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http

volumes: &common-volumes
  vol-local-gscloud:
    emptyDir: {}
  tmp-empty-dir:
    emptyDir: {}
  vol-gwc-cache:
    emptyDir: {}
  vol-jndi-config:                    
    configMap:
      name: geoserver-jndi-config

volumeMounts: &common-volume-mounts
  /etc/localconfig:
    name: vol-local-gscloud
  /tmp/:
    name: 'tmp-empty-dir'
  /opt/app/data_directory:
    name: vol-gwc-cache
  /etc/geoserver/jndi.yml:            
    name: vol-jndi-config
    subPath: jndi.yml

GEOWEBCACHE_CACHE_DIR:
  value: '/tmp/gwc'

ports: &common-ports
  http:
    containerPort: 8080
  health:
    containerPort: 8081

# Message bus for keeping GeoServer services in sync (templates/rabbitmq.yaml).
# Official RabbitMQ image; credentials come from geoserver-rabbitmq-secret.
# Spring Cloud Bus queues are transient, so no persistent volume is needed.
rabbitmq:
  enabled: true
  image:
    repository: docker.io/library/rabbitmq
    tag: '4.4-alpine'
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 0.1
      memory: 256Mi
    limits:
      cpu: 1
      memory: 512Mi

# PostGIS for the GeoServer catalog (pgconfig schema) and ingested data
# (templates/postgresql.yaml). Credentials come from geoserver-pgconfig-secret.
# Set enabled: false to use an external or managed database instead; point
# the host/port in geoserver-pgconfig-secret at it.
postgresql:
  enabled: true
  image:
    repository: docker.io/postgis/postgis
    tag: '18-3.7'
    pullPolicy: IfNotPresent
  persistence:
    size: 10Gi
    storageClass: ''  # empty = cluster default
  resources:
    requests:
      memory: 512Mi
      cpu: 0.2
    limits:
      memory: 2Gi
      cpu: 2.0

resources: &common-resources
  requests:
    memory: 256Mi
    cpu: 0.1
  limits:
    memory: 768Mi
    cpu: 4.0

env: &common-env
  SPRING_CONFIG_ADDITIONAL_LOCATION:
    value: 'file:/etc/geoserver/jndi.yml'
  GEOSERVER_BASE_PATH:
    value: '/geoserver-cloud'
  SPRING_PROFILES_ACTIVE:
    value: standalone,pgconfig,kube
  GWC_ENABLED:
    value: 'true'
  JAVA_OPTS_DEFAULT:
    value: '-DALLOW_ENV_PARAMETRIZATION=true -XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=25'
  JAVA_OPTS:
    order: 1
    value: '$(JAVA_OPTS_DEFAULT)'
  GEOTOOLS_HTTPCLIENT_PROXY_ENABLED:
    value: 'false'
  PGCONFIG_HOST:
    type: 'valueFrom'
    valueFrom:
      secretKeyRef:
        name: geoserver-pgconfig-secret
        key: host
  PGCONFIG_PORT:
    type: 'valueFrom'
    valueFrom:
      secretKeyRef:
        name: geoserver-pgconfig-secret
        key: port
  PGCONFIG_DATABASE:
    type: 'valueFrom'
    valueFrom:
      secretKeyRef:
        name: geoserver-pgconfig-secret
        key: database
  PGCONFIG_SCHEMA:
    type: 'valueFrom'
    valueFrom:
      secretKeyRef:
        name: geoserver-pgconfig-secret
        key: schema
  PGCONFIG_USERNAME:
    type: 'valueFrom'
    valueFrom:
      secretKeyRef:
        name: geoserver-pgconfig-secret
        key: username
  PGCONFIG_PASSWORD:
    type: 'valueFrom'
    valueFrom:
      secretKeyRef:
        name: geoserver-pgconfig-secret
        key: password
  PGCONFIG_INITIALIZE:
    value: 'true'
  APP_KUBERNETES_IO_INSTANCE:
    type: 'valueFrom'
    valueFrom:
      fieldRef:
        fieldPath: "metadata.labels['app.kubernetes.io/instance']"
  APP_KUBERNETES_IO_NAME:
    type: 'valueFrom'
    valueFrom:
      fieldRef:
        fieldPath: "metadata.labels['app.kubernetes.io/name']"
  APP_KUBERNETES_IO_COMPONENT:
    type: 'valueFrom'
    valueFrom:
      fieldRef:
        fieldPath: "metadata.labels['app.kubernetes.io/component']"
  SERVICE_GATEWAY_NAME:
    type: 'configMap'
    name: self-metadata
    key: SERVICE_GATEWAY_NAME
  SERVICE_GWC_NAME:
    type: 'configMap'
    name: self-metadata
    key: SERVICE_GWC_NAME
  SERVICE_REST_NAME:
    type: 'configMap'
    name: self-metadata
    key: SERVICE_REST_NAME
  SERVICE_WCS_NAME:
    type: 'configMap'
    name: self-metadata
    key: SERVICE_WCS_NAME
  SERVICE_WEBUI_NAME:
    type: 'configMap'
    name: self-metadata
    key: SERVICE_WEBUI_NAME
  SERVICE_WFS_NAME:
    type: 'configMap'
    name: self-metadata
    key: SERVICE_WFS_NAME
  SERVICE_WMS_NAME:
    type: 'configMap'
    name: self-metadata
    key: SERVICE_WMS_NAME
  SERVICE_WPS_NAME:
    type: 'configMap'
    name: self-metadata
    key: SERVICE_WPS_NAME
  SERVICE_ACL_NAME:
    type: 'configMap'
    name: self-metadata
    key: SERVICE_ACL_NAME
  TARGETS_WMS:
    order: 1
    value: 'http://$(SERVICE_WMS_NAME):8080'
  TARGETS_WFS:
    order: 1
    value: 'http://$(SERVICE_WFS_NAME):8080'
  TARGETS_WPS:
    order: 1
    value: 'http://$(SERVICE_WPS_NAME):8080'
  TARGETS_WCS:
    order: 1
    value: 'http://$(SERVICE_WCS_NAME):8080'
  TARGETS_GWC:
    order: 1
    value: 'http://$(SERVICE_GWC_NAME):8080'
  TARGETS_REST:
    order: 1
    value: 'http://$(SERVICE_REST_NAME):8080'
  TARGETS_WEBUI:
    order: 1
    value: 'http://$(SERVICE_WEBUI_NAME):8080'
  TARGETS_ACL:
    order: 1
    value: 'http://$(SERVICE_ACL_NAME):8080'
  ACL_URL:
    order: 1
    value: 'http://$(SERVICE_ACL_NAME):8080/acl/api'
  ACL_USERNAME:
    value: 'geoserver'
  SPRING_RABBITMQ_HOST:
    value: 'geoserver-rabbitmq'
  SPRING_RABBITMQ_PORT:
    value: '5672'
  SPRING_RABBITMQ_USERNAME:
    type: 'valueFrom'
    valueFrom:
      secretKeyRef:
        name: geoserver-rabbitmq-secret
        key: username
  SPRING_RABBITMQ_PASSWORD:
    type: 'valueFrom'
    valueFrom:
      secretKeyRef:
        name: geoserver-rabbitmq-secret
        key: password

common-spring-container-stuff: &common-spring-container-stuff
  resources:
    <<: *common-resources
  ports:
    <<: *common-ports
  volumeMounts:
    <<: *common-volume-mounts
  env:
    <<: *common-env

geoserver-spring-livenessProbe: &geoserver-spring-livenessProbe
  httpGet:
    path: /actuator/health/liveness
    port: health
  periodSeconds: 10
  failureThreshold: 10
  initialDelaySeconds: 120
geoserver-spring-readinessProbe: &geoserver-spring-readinessProbe
  httpGet:
    path: /actuator/health/readiness
    port: health
  periodSeconds: 5

common-generic-stuff: &common-generic-stuff
  releaseTrunc: 45
  prefixTrunc: 51
  template: true
  replicaCount: 1
  nameOverride: 'gsc'
  initContainers: {}
    #<<: *common-init-containers
  nodeSelector: {}
  affinity: {}

geoserver:
  metadata:
    enabled: true
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
  ingress:
    enabled: true
    hostGroups:
      host1:
        tls:
          enabled: false
        hosts:
          - gscloud.local

  serviceAccount:
    # Specifies whether a service account should be created
    create: false
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: default
  services:
    gateway:
      enabled: true
      ingress:
        enabled: true
        path: /geoserver-cloud/
      <<: *common-generic-stuff
      service:
        <<: *common-service-definition
      volumes:
        <<: *common-volumes
      containers:
        spring:
          <<: *common-spring-container-stuff
          livenessProbe:
            <<: *geoserver-spring-livenessProbe
          readinessProbe:
            <<: *geoserver-spring-readinessProbe
          image:
            <<: *common-image-stuff
            repository: docker.io/geoservercloud/geoserver-cloud-gateway
            sha: ''
    webui:
      enabled: true
      ingress:
        enabled: false
      <<: *common-generic-stuff
      service:
        <<: *common-service-definition
      volumes:
        <<: *common-volumes
      containers:
        spring:
          <<: *common-spring-container-stuff
          livenessProbe:
            <<: *geoserver-spring-livenessProbe
          readinessProbe:
            <<: *geoserver-spring-readinessProbe
          image:
            <<: *common-image-stuff
            repository: docker.io/geoservercloud/geoserver-cloud-webui
            sha: ''
    rest:
      enabled: true
      ingress:
        enabled: false
      <<: *common-generic-stuff
      service:
        <<: *common-service-definition
      volumes:
        <<: *common-volumes
      containers:
        spring:
          <<: *common-spring-container-stuff
          livenessProbe:
            <<: *geoserver-spring-livenessProbe
          readinessProbe:
            <<: *geoserver-spring-readinessProbe
          image:
            <<: *common-image-stuff
            repository: docker.io/geoservercloud/geoserver-cloud-rest
            sha: ''
    wfs:
      enabled: true
      ingress:
        enabled: false
      <<: *common-generic-stuff
      service:
        <<: *common-service-definition
      volumes:
        <<: *common-volumes
      containers:
        spring:
          <<: *common-spring-container-stuff
          livenessProbe:
            <<: *geoserver-spring-livenessProbe
          readinessProbe:
            <<: *geoserver-spring-readinessProbe
          image:
            <<: *common-image-stuff
            repository: docker.io/geoservercloud/geoserver-cloud-wfs
            sha: ''
    wms:
      enabled: true
      hpa:
        enabled: false
        minReplicas: 1
        maxReplicas: 16
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 70
      ingress:
        enabled: false
      <<: *common-generic-stuff
      service:
        <<: *common-service-definition
      volumes:
        <<: *common-volumes
      containers:
        spring:
          <<: *common-spring-container-stuff
          livenessProbe:
            <<: *geoserver-spring-livenessProbe
          readinessProbe:
            <<: *geoserver-spring-readinessProbe
          image:
            <<: *common-image-stuff
            repository: docker.io/geoservercloud/geoserver-cloud-wms
            sha: ''
    wcs:
      enabled: true
      ingress:
        enabled: false
      <<: *common-generic-stuff
      service:
        <<: *common-service-definition
      volumes:
        <<: *common-volumes
      containers:
        spring:
          <<: *common-spring-container-stuff
          livenessProbe:
            <<: *geoserver-spring-livenessProbe
          readinessProbe:
            <<: *geoserver-spring-readinessProbe
          image:
            <<: *common-image-stuff
            repository: docker.io/geoservercloud/geoserver-cloud-wcs
            sha: ''
    wps:
      enabled: false
      ingress:
        enabled: false
      <<: *common-generic-stuff
      service:
        <<: *common-service-definition
      volumes:
        <<: *common-volumes
      containers:
        spring:
          <<: *common-spring-container-stuff
          livenessProbe:
            <<: *geoserver-spring-livenessProbe
          readinessProbe:
            <<: *geoserver-spring-readinessProbe
          image:
            <<: *common-image-stuff
            repository: docker.io/geoservercloud/geoserver-cloud-wps
            sha: ''
    gwc:
      enabled: true
      ingress:
        enabled: false
      <<: *common-generic-stuff
      service:
        <<: *common-service-definition
      volumes:
        <<: *common-volumes
      containers:
        spring:
          <<: *common-spring-container-stuff
          livenessProbe:
            <<: *geoserver-spring-livenessProbe
          readinessProbe:
            <<: *geoserver-spring-readinessProbe
          image:
            <<: *common-image-stuff
            repository: docker.io/geoservercloud/geoserver-cloud-gwc
            sha: ''
    acl:
      enabled: false
      ingress:
        enabled: false
      <<: *common-generic-stuff
      service:
        <<: *common-service-definition
      volumes:
        <<: *common-volumes
      containers:
        spring:
          <<: *common-spring-container-stuff
          env:
            GEOSERVER_BUS_ENABLED:
              value: 'true'
            PG_HOST:
              value: 'acldb'
            PG_PORT:
              value: '5432'
            PG_DB:
              value: 'acl'
            PG_SCHEMA:
              value: 'acl'
            PG_USERNAME:
              value: 'acl'
          image:
            tag: '3.0.4'
            repository: docker.io/geoservercloud/geoserver-acl
            sha: ''
# gisdata (templates/gisdata.yaml): the project's files become the gisdata-project
# ConfigMap; a Job runs `gisdata apply` after every install and upgrade, and a
# CronJob runs `gisdata sync` nightly. Schemas, backups, layers and each dataset's
# schedule come from the project files, not from here.
gisdata:
  # The project directory, relative to this chart (files outside a chart can't be read by Helm).
  # Its *.yaml, *.yml, *.sld, *.mbstyle and *.css files become the ConfigMap; secrets.yaml never does.
  project: examples/uk-basemap
  # Secrets the project names, mounted as files for gisdata (a missing one is skipped,
  # so an optional API key can be left out). See geoserver-secrets.example.yaml.
  secrets:
    - geoserver-pgconfig-secret
    - geoserver-admin   # for apply, and to refresh layer bounds and cached tiles after a load
    - os-api
  image:
    repository: gisdata  # build from ./Dockerfile and push to your registry
    tag: latest
    pullPolicy: Always
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 2Gi }
  # `gisdata apply` after every install and upgrade, as a Job Helm doesn't wait for
  # (a first apply loads data, which can take a while). `kubectl logs job/gisdata-apply-<revision>`.
  apply:
    enabled: true
    prune: false          # true: also delete what the project's workspace holds that the files don't mention
    waitSeconds: 900      # how long to wait for GeoServer to come up first
  # `gisdata sync` nightly; each Dataset's `update` decides whether it is checked that night.
  sync:
    enabled: true
    schedule: '0 2 * * *'
  # `gisdata plan` hourly: its Job fails when GeoServer has drifted from the files (say a layer
  # changed in the web UI), so drift shows in `kubectl get jobs` and in alerts on failed Jobs.
  drift:
    enabled: true
    schedule: '30 * * * *'
