# traefik-auth.yaml
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: geoserver-auth
  namespace: default
spec:
  forwardAuth:
    address: http://geoserver-auth-sidecar.default.svc.cluster.local:8081/check
    authResponseHeaders:
      - X-Auth-User
    trustForwardHeader: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: geoserver-cloud-auth
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: default-geoserver-auth@kubernetescrd
spec:
  rules:
    - host: gscloud.local
      http:
        paths:
          - path: /geoserver-cloud/
            pathType: Prefix
            backend:
              service:
                name: geoserver-gsc-gateway   # matches your nameOverride: 'gsc'
                port:
                  number: 8080