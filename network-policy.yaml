# network-policy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: geoserver-gateway-ingress
  namespace: default
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gsc
      app.kubernetes.io/component: gateway  # <-- pins it to gateway only
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system