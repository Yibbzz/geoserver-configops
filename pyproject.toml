[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "configops"
version = "0.1.0"
description = "GeoServer ConfigOps: GeoServer configuration and open GIS data as code, with plan, apply and drift detection"
readme = "docs/spec/datasets.md"
license = { text = "BSD-2-Clause" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "jsonschema>=4.18", "requests>=2.28", "psycopg2-binary>=2.9"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
configops = "configops.cli:main"

[tool.setuptools]
packages = ["configops", "configops.sources"]

[tool.setuptools.package-data]
configops = ["schema/*.json", "security_defaults.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs a PostGIS database (TEST_DB_* env vars) and ogr2ogr",
    "e2e: needs the real GeoServer Cloud REST service (tests/e2e/up.sh)",
    "last(order=2): runs after the other tests, lowest order first (tests/test_e2e_coverage.py checks what they saw)",
]
addopts = "-ra"
