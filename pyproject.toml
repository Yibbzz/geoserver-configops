[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gisdata"
version = "0.1.0"
description = "Version-controlled open GIS datasets for GeoServer Cloud (working name)"
readme = "docs/spec/datasets.md"
license = { text = "BSD-2-Clause" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "jsonschema>=4.18", "requests>=2.28", "psycopg2-binary>=2.9"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
gisdata = "gisdata.cli:main"

[tool.setuptools]
packages = ["gisdata", "gisdata.sources"]

[tool.setuptools.package-data]
gisdata = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs a PostGIS database (TEST_DB_* env vars) and ogr2ogr",
    "e2e: needs the real GeoServer Cloud REST service (tests/e2e/up.sh)",
]
addopts = "-ra"
