[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "geoserver-configops"
version = "0.1.0"
description = "GeoServer ConfigOps: GeoServer and GeoServer Cloud configuration as code, with plan, apply, import and drift detection"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "jsonschema>=4.18", "requests>=2.28", "psycopg2-binary>=2.9"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
configops = "configops.cli:main"

[tool.setuptools]
packages = ["configops"]

[tool.setuptools.package-data]
configops = ["schema/*.json", "security_defaults.json", "csp_default.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/e2e/data", "tests/e2e/gcs", "tests/e2e/standard-libs"]  # files GeoServer writes (owned by its user)
pythonpath = ["."]
markers = [
    "e2e: needs the real GeoServer Cloud REST service (tests/e2e/up.sh)",
    "last(order=2): runs after the other tests, lowest order first (tests/test_e2e_coverage.py checks what they saw)",
]
addopts = "-ra"
