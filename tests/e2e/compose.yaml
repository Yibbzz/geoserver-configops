# GeoServer Cloud (profile cloud): its gateway, REST, WMS, WFS, WCS and tile cache services on
# one pgconfig catalog, kept in step through RabbitMQ, as its own Kubernetes deployments run them.
# Or (profile standard) the official GeoServer of the version GeoServer Cloud is built on,
# with the extensions GeoServer Cloud ships. Started by tests/e2e/up.sh [standard].
name: gscloud-e2e
x-pgconfig: &pgconfig
  PGCONFIG_HOST: db
  PGCONFIG_PORT: "5432"
  PGCONFIG_DATABASE: postgres
  PGCONFIG_SCHEMA: pgconfig
  PGCONFIG_USERNAME: postgres
  PGCONFIG_PASSWORD: postgres
  PGCONFIG_INITIALIZE: "true"
# What every GeoServer Cloud service shares: the catalog, the bus, the JNDI datasource and /data
x-cloud: &cloud
  profiles: [cloud]
  mem_limit: 768m  # the heap is half of it (MaxRAMPercentage); without a limit each service sizes it from the whole machine
  restart: on-failure  # as Kubernetes restarts a pod
  depends_on: {db: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}
  environment: &cloud-env
    <<: *pgconfig
    SPRING_PROFILES_ACTIVE: standalone,pgconfig
    SPRING_CONFIG_ADDITIONAL_LOCATION: file:/etc/geoserver/jndi.yml
    GEOSERVER_BASE_PATH: /geoserver-cloud
    SPRING_RABBITMQ_HOST: rabbitmq
    SPRING_RABBITMQ_PORT: "5672"
    SPRING_RABBITMQ_USERNAME: user
    SPRING_RABBITMQ_PASSWORD: guest
    JAVA_OPTS: -DALLOW_ENV_PARAMETRIZATION=true -XX:MaxRAMPercentage=50
    GEOSERVER_EXTENSION_APPSCHEMA_ENABLED: "true"
    GEOTOOLS_HTTPCLIENT_PROXY_ENABLED: "false"  # the proxy HTTP client can't do without connection pooling
    LOGGING_LEVEL_ORG_GEOSERVER_FILTERS: INFO  # request logging (Settings global.requestLogging) logs at INFO
  volumes: ["./jndi.yml:/etc/geoserver/jndi.yml:ro", "./data:/data"]  # data: file stores' files, shared by every service
  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health/readiness"]
    interval: 5s
    retries: 60
    start_period: 30s
services:
  db:
    image: ${POSTGIS_IMAGE}
    environment: {POSTGRES_DB: postgres, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
    ports: ["${E2E_DB_PORT:-55433}:5432"]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "postgres"], interval: 3s, retries: 40}
  rabbitmq:
    profiles: [cloud]
    image: ${RABBITMQ_IMAGE}
    environment: {RABBITMQ_DEFAULT_USER: user, RABBITMQ_DEFAULT_PASS: guest}
    healthcheck: {test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"], interval: 5s, retries: 40}
  # Stand-ins for Azure Blob Storage and Google Cloud Storage, for the tile cache's blob stores
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite-blob --blobHost 0.0.0.0 --loose --skipApiVersionCheck
  fakegcs:
    image: fsouza/fake-gcs-server:1.52.2
    command: -scheme http -port 4443 -public-host fakegcs:4443 -backend memory
    volumes: ["./gcs:/data"]  # gcs/<bucket>: the buckets it starts with
    ports: ["${E2E_GCS_PORT:-54443}:4443"]
  # An LDAP directory for the LDAP login test; up.sh adds ldap/users.ldif
  ldap:
    image: osixia/openldap:1.5.0
    environment: {LDAP_ORGANISATION: Example, LDAP_DOMAIN: example.org, LDAP_ADMIN_PASSWORD: admin}
    volumes: ["./ldap:/e2e:ro"]
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-b", "dc=example,dc=org", "-D", "cn=admin,dc=example,dc=org", "-w", "admin"]
      interval: 3s
      retries: 40
  rest:
    <<: *cloud
    image: geoservercloud/geoserver-cloud-rest:${GEOSERVER_TAG}
    mem_limit: 1g  # it reads every store it makes (GeoParquet through DuckDB, outside the heap)
    ports: ["${E2E_REST_PORT:-59093}:8080"]  # reached directly, without the gateway
  wms:
    <<: *cloud
    image: geoservercloud/geoserver-cloud-wms:${GEOSERVER_TAG}
    mem_limit: 1536m  # draws the raster tests' maps and tiles (a reprojected Sentinel-2 image)
  wfs:
    <<: *cloud
    image: geoservercloud/geoserver-cloud-wfs:${GEOSERVER_TAG}
  wcs:
    <<: *cloud
    image: geoservercloud/geoserver-cloud-wcs:${GEOSERVER_TAG}
  gwc:
    <<: *cloud
    image: geoservercloud/geoserver-cloud-gwc:${GEOSERVER_TAG}
    mem_limit: 1536m  # draws the raster tests' maps and tiles (a reprojected Sentinel-2 image)
  gateway:
    <<: *cloud
    image: geoservercloud/geoserver-cloud-gateway:${GEOSERVER_TAG}
    depends_on: {rest: {condition: service_healthy}, wms: {condition: service_healthy}, wfs: {condition: service_healthy},
                 wcs: {condition: service_healthy}, gwc: {condition: service_healthy}}
    environment:
      <<: *cloud-env
      TARGETS_REST: http://rest:8080
      TARGETS_WMS: http://wms:8080
      TARGETS_WFS: http://wfs:8080
      TARGETS_WCS: http://wcs:8080
      TARGETS_GWC: http://gwc:8080
      TARGETS_WEBUI: http://webui:8080  # not started
      TARGETS_WPS: http://wps:8080
    ports: ["${E2E_GATEWAY_PORT:-59090}:8080"]
  # Standard GeoServer: the version GeoServer Cloud is built on, with the extensions GeoServer Cloud ships
  # (downloaded once into standard-libs/<version>/), the same JNDI PostGIS datasource and the shared data folder
  geoserver:
    profiles: [standard]
    image: docker.osgeo.org/geoserver:${STANDARD_GEOSERVER_VERSION}
    depends_on: {db: {condition: service_healthy}}
    environment:
      SKIP_DEMO_DATA: "true"  # start empty, as GeoServer Cloud does
      INSTALL_EXTENSIONS: "true"
      STABLE_EXTENSIONS: app-schema,arcgrid,authkey,control-flow,css,mbstyle,vectortiles,sqlserver,oracle,gwc-s3,ogcapi-features,pyramid
      COMMUNITY_EXTENSIONS: cog-http,cog-s3,cog-azure,cog-google,flatgeobuf,gwc-azure-blobstore,gwc-gcs-blobstore,geoparquet,pmtiles-store
      POSTGRES_JNDI_ENABLED: "true"
      POSTGRES_JNDI_RESOURCE_NAME: jdbc/mypostgis
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: postgres
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      EXTRA_JAVA_OPTS: -Xms256m -Xmx1g
    entrypoint: ["bash", "/e2e/standard-start.sh"]
    volumes: ["./standard-libs/${STANDARD_GEOSERVER_VERSION}:/opt/additional_libs", "./data:/data", "./standard-start.sh:/e2e/standard-start.sh:ro"]
    ports: ["${E2E_STANDARD_PORT:-59091}:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "-u", "admin:geoserver", "http://localhost:8080/geoserver/rest/about/version.json"]
      interval: 5s
      retries: 120
      start_period: 60s
