# The real GeoServer Cloud REST service, wired the way the Helm chart wires it:
# same images and tags, same pgconfig settings and the chart's rendered jndi.yml.
# Started by tests/e2e/up.sh; used by the e2e tests (pytest -m e2e).
name: gscloud-e2e
x-pgconfig: &pgconfig
  PGCONFIG_HOST: db
  PGCONFIG_PORT: "5432"
  PGCONFIG_DATABASE: postgres
  PGCONFIG_SCHEMA: pgconfig
  PGCONFIG_USERNAME: postgres
  PGCONFIG_PASSWORD: postgres
  PGCONFIG_INITIALIZE: "true"
services:
  db:
    image: ${POSTGIS_IMAGE}
    environment: {POSTGRES_DB: postgres, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
    ports: ["${E2E_DB_PORT:-55433}:5432"]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "postgres"], interval: 3s, retries: 40}
  rabbitmq:
    image: ${RABBITMQ_IMAGE}
    environment: {RABBITMQ_DEFAULT_USER: user, RABBITMQ_DEFAULT_PASS: guest}
    healthcheck: {test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"], interval: 5s, retries: 40}
  # Stand-ins for Azure Blob Storage and Google Cloud Storage, for the tile cache's blob stores
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite-blob --blobHost 0.0.0.0 --loose --skipApiVersionCheck
  fakegcs:
    image: fsouza/fake-gcs-server:1.52.2
    command: -scheme http -port 4443 -public-host fakegcs:4443 -backend memory
    volumes: ["./gcs:/data"]  # gcs/<bucket>: the buckets it starts with
    ports: ["${E2E_GCS_PORT:-54443}:4443"]
  # An LDAP directory for the LDAP login test; up.sh adds ldap/users.ldif
  ldap:
    image: osixia/openldap:1.5.0
    environment: {LDAP_ORGANISATION: Example, LDAP_DOMAIN: example.org, LDAP_ADMIN_PASSWORD: admin}
    volumes: ["./ldap:/e2e:ro"]
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-b", "dc=example,dc=org", "-D", "cn=admin,dc=example,dc=org", "-w", "admin"]
      interval: 3s
      retries: 40
  rest:
    image: geoservercloud/geoserver-cloud-rest:${GEOSERVER_TAG}
    depends_on: {db: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}
    environment:
      <<: *pgconfig
      SPRING_PROFILES_ACTIVE: standalone,pgconfig
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/etc/geoserver/jndi.yml
      GEOSERVER_BASE_PATH: /geoserver-cloud
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: guest
      JAVA_OPTS: -DALLOW_ENV_PARAMETRIZATION=true -XX:MaxRAMPercentage=50
      GEOSERVER_EXTENSION_APPSCHEMA_ENABLED: "true"  # as values-app-schema.yaml turns it on
    # data: the shared data volume, as the chart mounts it; test_e2e_file_stores.py writes its files there
    volumes: ["./jndi.yml:/etc/geoserver/jndi.yml:ro", "./data:/data"]
    ports: ["${E2E_REST_PORT:-59090}:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health/readiness"]
      interval: 5s
      retries: 60
      start_period: 30s
