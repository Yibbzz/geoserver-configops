{{- if .Values.sync.enabled }}
{{- /* The project's files, keyed 000-<name> (ConfigMap keys can't hold "/"), mounted back at their paths */ -}}
{{- $dir := trimSuffix "/" .Values.sync.project }}
{{- $files := dict }}  {{- /* path -> content */}}
{{- $keys := dict }}   {{- /* path -> ConfigMap key */}}
{{- $size := 0 }}
{{- range $path, $_ := .Files.Glob (printf "%s/**" $dir) }}
{{- $name := base $path }}
{{- if and (regexMatch "\\.(ya?ml|sld|mbstyle|css)$" $path) (not (regexMatch "^secrets\\.ya?ml$" $name)) }}
{{- $_ := set $keys $path (printf "%03d-%s" (len $keys) (regexReplaceAll "[^-._a-zA-Z0-9]" $name "_")) }}
{{- $_ := set $files $path ($.Files.Get $path) }}
{{- $size = add $size (len ($.Files.Get $path)) }}
{{- end }}
{{- end }}
{{- if not $files }}
{{- fail (printf "sync.project: no project files found in %s (the directory must be inside the chart, and not in .helmignore)" $dir) }}
{{- end }}
{{- if gt $size 900000 }}
{{- fail (printf "sync.project: %s holds %d bytes of files, more than a ConfigMap can (about 1 MB)" $dir $size) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: gisdata-project
data:
{{- range $path, $content := $files }}
  {{ get $keys $path }}: {{ $content | toJson }}
{{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gisdata-sync
spec:
  schedule: {{ .Values.sync.schedule | quote }}
  concurrencyPolicy: Forbid  # never two loads at once
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0  # a failed dataset is retried by the next run, not straight away
      template:
        metadata:
          annotations:
            # a new project version shows on the job's pods
            checksum/project: {{ toJson $files | sha256sum }}
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
          containers:
            - name: sync
              image: "{{ .Values.sync.image.repository }}:{{ .Values.sync.image.tag }}"
              imagePullPolicy: {{ .Values.sync.image.pullPolicy }}
              args: ["sync", "-C", "/project"]
              env:
                - name: GISDATA_SECRETS_DIR
                  value: /etc/gisdata/secrets
              resources: {{- toYaml .Values.sync.resources | nindent 16 }}
              volumeMounts:
                - name: project
                  mountPath: /project
                  readOnly: true
                - name: work
                  mountPath: /tmp
                {{- range .Values.sync.secrets }}
                - name: secret-{{ . }}
                  mountPath: /etc/gisdata/secrets/{{ . }}
                  readOnly: true
                {{- end }}
          volumes:
            - name: project
              configMap:
                name: gisdata-project
                items:
                {{- range $path, $key := $keys }}
                  - key: {{ $key }}
                    path: {{ trimPrefix (printf "%s/" $dir) $path | quote }}
                {{- end }}
            - name: work  # downloads are unpacked here
              emptyDir: {}
            {{- range .Values.sync.secrets }}
            - name: secret-{{ . }}
              secret:
                secretName: {{ . }}
                optional: true
            {{- end }}
{{- end }}
