{{- if .Values.ingest.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: geoserver-data-ingest
spec:
  schedule: {{ .Values.ingest.schedule | quote }}
  concurrencyPolicy: Forbid  # don't run if previous is still going
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ingest
              image: "{{ .Values.ingest.image.repository }}:{{ .Values.ingest.image.tag }}"
              imagePullPolicy: {{ .Values.ingest.image.pullPolicy }}
              env:
                - name: PROD_SCHEMA
                  value: {{ .Values.ingest.prodSchema | quote }}
                - name: STAGING_SCHEMA
                  value: {{ .Values.ingest.stagingSchema | quote }}
                - name: BACKUP_SCHEMA
                  value: {{ .Values.ingest.backupSchema | quote }}
                - name: BACKUP_RETENTION
                  value: {{ .Values.ingest.backupRetention | quote }}
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: geoserver-pgconfig-secret
                      key: database
                - name: DB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: geoserver-pgconfig-secret
                      key: host
                - name: DB_PORT
                  valueFrom:
                    secretKeyRef:
                      name: geoserver-pgconfig-secret
                      key: port
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: geoserver-pgconfig-secret
                      key: username
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: geoserver-pgconfig-secret
                      key: password
                - name: OS_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: geoserver-ingest-secret
                      key: os-api-key
{{- end }}
