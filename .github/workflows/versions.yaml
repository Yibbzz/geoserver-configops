name: GeoServer versions

# Daily: when GeoServer Cloud or GeoServer has a new release, pin it (tests/versions.py), open a pull
# request, and run CI on it (GitHub holds CI on a pull request the workflow opened until it's
# approved; the workflow approves it). Needs Settings → Actions → General → "Allow GitHub Actions to
# create and approve pull requests".
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: pip install -e '.[dev]'
      - name: Pin the newest versions
        id: versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tests/versions.py update
      - name: Open a pull request and run CI on it
        if: steps.versions.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.versions.outputs.branch }}
          TITLE: ${{ steps.versions.outputs.title }}
        run: |
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null; then
            echo "$BRANCH is already open"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "$TITLE"
          git push origin "$BRANCH"
          gh pr create --head "$BRANCH" --title "$TITLE" --body "A new release: tests/versions.py pinned it. CI runs every e2e test on both. If it fails, the log says what changed, such as settings the new GeoServer added that docs/geoserver-fields.yaml hasn't sorted yet."
          # GitHub holds CI on a pull request the workflow's token opened ("action_required"): approve it,
          # so it runs and shows on the pull request. If no run turns up, start one.
          for _ in $(seq 1 24); do
            run=$(gh run list --workflow ci.yaml --branch "$BRANCH" --event pull_request --json databaseId,conclusion \
              --jq '.[0] | select(.conclusion == "action_required") | .databaseId')
            [ -n "$run" ] && break
            sleep 5
          done
          if [ -n "$run" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/approve"
          else
            gh workflow run ci.yaml --ref "$BRANCH"
          fi
