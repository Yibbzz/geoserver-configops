name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: Helm lint
        run: helm lint .
      - name: Validate manifests against Kubernetes schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for extra in "" "-f values-data-volume.yaml" "--set configops.sync.enabled=false --set configops.apply.enabled=false --set configops.drift.enabled=false"; do
            echo "== helm template $extra"
            helm template geoserver . -f values.yaml $extra | ./kubeconform -strict -summary -kubernetes-version 1.37.0 -
          done
      - name: Shellcheck
        run: shellcheck tests/e2e/*.sh tests/kind/*.sh tests/ci/*.sh

  test:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_DB: gis
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install GDAL
        run: tests/ci/install-gdal.sh
      - name: Install Python dependencies
        run: pip install -e '.[dev]'
      - name: Run tests
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: '5432'
          TEST_DB_NAME: gis
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres
        run: pytest
      - name: Validate the example project
        run: configops validate examples/uk-basemap

  configops-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the configops image
        run: docker build -t configops:ci .
      - name: Smoke test
        run: |
          docker run --rm configops:ci --version
          docker run --rm --entrypoint ogr2ogr configops:ci --version
          docker run --rm -v "$PWD/examples/uk-basemap:/project:ro" configops:ci validate /project

  # The real GeoServer Cloud REST service (same images and jndi.yml as the chart) in Docker,
  # then the e2e tests against it.
  e2e-rest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install GDAL (plan/apply load a dataset)
        run: tests/ci/install-gdal.sh
      - name: Install Python dependencies
        run: pip install -e '.[dev]'
      - name: Start GeoServer Cloud REST, PostGIS and RabbitMQ
        run: tests/e2e/up.sh
      - name: e2e tests
        env:
          E2E_GEOSERVER_URL: http://localhost:59090/rest
          E2E_DB_PORT: '55433'
          E2E_GWC_URL: http://localhost:59090/geoserver-cloud/gwc/rest  # REST service reached without its gateway
          E2E_DATA_DIR: tests/e2e/data  # mounted at /data in the REST service
          E2E_LDAP_URL: ldap://ldap:389  # the directory up.sh starts, as GeoServer reaches it
          E2E_REST_CONTAINER: gscloud-e2e-rest-1  # restarted by the caching defaults test
        run: pytest -m e2e -v
      - name: Logs on failure
        if: failure()
        run: docker logs --tail 300 gscloud-e2e-rest-1  # compose would need up.sh's image variables

  # The whole chart on a throwaway kind cluster: every pod ready, OGC services through
  # the gateway, the e2e tests against the deployment, and examples/smoke drawn with WMS.
  kind-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: pip install -e '.[dev]'
      - name: Install GDAL (plan/apply load a dataset)
        run: tests/ci/install-gdal.sh
      - uses: helm/kind-action@v1.15.2
        with:
          cluster_name: gscloud
      - name: Deploy and test
        run: tests/kind/deploy-test.sh
