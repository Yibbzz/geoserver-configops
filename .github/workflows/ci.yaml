name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the Kubernetes example against Kubernetes's schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.37.0 docs/kubernetes/configops.yaml
      - name: Shellcheck
        run: shellcheck tests/e2e/*.sh tests/ci/*.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: pip install -e '.[dev]'
      - name: Run tests
        run: pytest
      - name: Validate the example projects
        run: for p in examples/*/; do configops validate "$p" || exit 1; done

  configops-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the configops image
        run: docker build -t configops:ci .
      - name: Smoke test
        run: |
          docker run --rm configops:ci --version
          docker run --rm -v "$PWD/examples/uk-basemap:/project:ro" configops:ci validate /project

  # GeoServer Cloud in Docker (gateway, REST, WMS, WFS, WCS and the tile cache), then the e2e tests against it
  e2e-cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install GDAL (some e2e tests make their files with it)
        run: tests/ci/install-gdal.sh
      - name: Install Python dependencies
        run: pip install -e '.[dev]'
      - name: Start GeoServer Cloud, PostGIS and RabbitMQ
        run: tests/e2e/up.sh
      - name: e2e tests
        env:
          E2E_GEOSERVER_URL: http://localhost:59090/geoserver-cloud/rest
          E2E_SERVICES_URL: http://localhost:59090/geoserver-cloud
          E2E_DB_PORT: '55433'
          E2E_DB_HOST_IN_GEOSERVER: db
          E2E_DATA_DIR: tests/e2e/data  # mounted at /data in every GeoServer service
          E2E_LDAP_URL: ldap://ldap:389  # the directory up.sh starts, as GeoServer reaches it
          E2E_REST_CONTAINER: gscloud-e2e-rest-1  # restarted by the caching defaults test
          E2E_WMS_CONTAINER: gscloud-e2e-wms-1  # its log shows request logging
        run: pytest -m e2e -v
      - name: Logs on failure
        if: failure()
        run: |
          for s in rest wms gateway; do echo "== $s"; docker logs gscloud-e2e-$s-1 2>&1 | grep -v accesslog | tail -150; done

  # The same e2e tests against standard GeoServer: the version GeoServer Cloud is built on, with the
  # extensions GeoServer Cloud ships, one process serving REST, the OGC services and the tile cache.
  e2e-standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install GDAL (some e2e tests make their files with it)
        run: tests/ci/install-gdal.sh
      - name: Install Python dependencies
        run: pip install -e '.[dev]'
      - name: Start standard GeoServer and PostGIS
        run: tests/e2e/up.sh standard
      - name: e2e tests
        env:
          E2E_GEOSERVER_URL: http://localhost:59091/geoserver/rest
          E2E_SERVICES_URL: http://localhost:59091/geoserver
          E2E_GWC_URL: http://localhost:59091/geoserver/gwc/rest
          E2E_DB_PORT: '55433'
          E2E_DB_HOST_IN_GEOSERVER: db
          E2E_DATA_DIR: tests/e2e/data
          E2E_LDAP_URL: ldap://ldap:389
          E2E_REST_CONTAINER: gscloud-e2e-geoserver-1  # restarted by the caching defaults test; its log has the requests
        run: pytest -m e2e -v
      - name: Logs on failure
        if: failure()
        run: docker logs gscloud-e2e-geoserver-1 2>&1 | tail -300
