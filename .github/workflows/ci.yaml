name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # .github/workflows/versions.yaml runs it on the pull requests it opens

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Check the Kubernetes example against Kubernetes's schemas
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.37.0 docs/kubernetes/configops.yaml
      - name: Shellcheck
        run: shellcheck tests/e2e/*.sh tests/ci/*.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: pip install -e '.[dev]'
      - name: Run tests
        run: pytest
      - name: Validate the example projects
        run: for p in examples/*/; do configops validate "$p" || exit 1; done

  configops-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Build the configops image
        run: docker build -t configops:ci .
      - name: Smoke test
        run: |
          docker run --rm configops:ci --version
          docker run --rm -v "$PWD/examples/uk-basemap:/project:ro" configops:ci validate /project
      - name: Build a project image (docs/kubernetes/Dockerfile) and check no secrets file reaches it
        run: |
          printf 'geoserver-admin: { username: admin, password: not-for-the-registry }\n' > examples/quickstart/secrets.yaml
          docker build -f docs/kubernetes/Dockerfile --build-arg PROJECT=quickstart \
            --build-arg CONFIGOPS_IMAGE=configops --build-arg CONFIGOPS_VERSION=ci -t project:ci examples
          docker run --rm project:ci validate /project
          docker run --rm --entrypoint sh project:ci -c 'test -f /project/project.yaml && ! find / -xdev -name "secrets.y*ml" | grep .'
          if docker save project:ci | grep -a -q not-for-the-registry; then echo "the secret is in a layer of the image"; exit 1; fi

  # GeoServer Cloud in Docker (gateway, REST, WMS, WFS, WCS and the tile cache), then the e2e tests against it
  e2e-cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.14'
      - name: Install GDAL (some e2e tests make their files with it)
        run: tests/ci/install-gdal.sh
      - name: Install Python dependencies
        run: pip install -e '.[dev]'
      - name: Start GeoServer Cloud, PostGIS and RabbitMQ
        run: tests/e2e/up.sh
      - name: e2e tests
        env:
          E2E_GEOSERVER_URL: http://localhost:59090/geoserver-cloud/rest
          E2E_SERVICES_URL: http://localhost:59090/geoserver-cloud
          E2E_DB_PORT: '55433'
          E2E_DB_HOST_IN_GEOSERVER: db
          E2E_DATA_DIR: tests/e2e/data  # mounted at /data in every GeoServer service
          E2E_LDAP_URL: ldap://ldap:389  # the directory up.sh starts, as GeoServer reaches it
          E2E_REST_CONTAINER: gscloud-e2e-rest-1  # restarted by the caching defaults test
          E2E_WMS_CONTAINER: gscloud-e2e-wms-1  # its log shows request logging
        run: pytest -m e2e -v
      - name: Logs on failure
        if: failure()
        run: |
          for s in rest wms gateway; do echo "== $s"; docker logs gscloud-e2e-$s-1 2>&1 | grep -v accesslog | tail -150; done

  # The same e2e tests against standard GeoServer: the version GeoServer Cloud is built on, with the
  # extensions GeoServer Cloud ships, one process serving REST, the OGC services and the tile cache.
  e2e-standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.14'
      - name: Install GDAL (some e2e tests make their files with it)
        run: tests/ci/install-gdal.sh
      - name: Install Python dependencies
        run: pip install -e '.[dev]'
      - name: The extensions' fallback copies, from the last good run (GeoServer 3)
        id: libs
        run: |
          v=$(sed -n 's/^export STANDARD_GEOSERVER_VERSION=\([^ ]*\).*/\1/p' tests/e2e/up.sh)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: tests/e2e/standard-libs-fallback/${{ steps.libs.outputs.version }}
          key: standard-libs-${{ steps.libs.outputs.version }}-none
          restore-keys: standard-libs-${{ steps.libs.outputs.version }}-
      # docker.osgeo.org is slow from GitHub's runners (minutes for the GeoServer image): it comes from the cache
      - name: The GeoServer image's name
        id: image
        run: |
          v=$(sed -n 's/^export STANDARD_GEOSERVER_VERSION=\([^ ]*\).*/\1/p' tests/e2e/up.sh)
          echo "name=docker.osgeo.org/geoserver:$v" >> "$GITHUB_OUTPUT"
      - name: The GeoServer image, from the cache
        id: image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/geoserver-image.tar
          key: image-${{ steps.image.outputs.name }}
      - name: Load the GeoServer image
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: docker load -i ~/geoserver-image.tar
      - name: Start standard GeoServer and PostGIS
        run: tests/e2e/up.sh standard
      - name: Keep the GeoServer image for the next run
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: docker save "${{ steps.image.outputs.name }}" -o ~/geoserver-image.tar
      - name: Save it in the cache
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/geoserver-image.tar
          key: image-${{ steps.image.outputs.name }}
      - name: e2e tests
        env:
          E2E_GEOSERVER_URL: http://localhost:59091/geoserver/rest
          E2E_SERVICES_URL: http://localhost:59091/geoserver
          E2E_GWC_URL: http://localhost:59091/geoserver/gwc/rest
          E2E_DB_PORT: '55433'
          E2E_DB_HOST_IN_GEOSERVER: db
          E2E_DATA_DIR: tests/e2e/data
          E2E_LDAP_URL: ldap://ldap:389
          E2E_REST_CONTAINER: gscloud-e2e-geoserver-1  # restarted by the caching defaults test; its log has the requests
        run: pytest -m e2e -v
      - name: Keep this run's extensions as the fallback copies
        run: tests/ci/keep-extensions.sh "${{ steps.libs.outputs.version }}"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: tests/e2e/standard-libs-fallback/${{ steps.libs.outputs.version }}
          key: standard-libs-${{ steps.libs.outputs.version }}-${{ hashFiles(format('tests/e2e/standard-libs-fallback/{0}/**', steps.libs.outputs.version)) }}
      - name: Logs on failure
        if: failure()
        run: docker logs gscloud-e2e-geoserver-1 2>&1 | tail -300

  # And against GeoServer 2.28, the older series still maintained (tests/e2e/up.sh pins its newest)
  e2e-standard-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.14'
      - name: Install GDAL (some e2e tests make their files with it)
        run: tests/ci/install-gdal.sh
      - name: Install Python dependencies
        run: pip install -e '.[dev]'
      - name: The extensions' fallback copies, from the last good run (GeoServer 2.28)
        id: libs
        run: |
          v=$(sed -n 's/^export STANDARD_2_GEOSERVER_VERSION=\([^ ]*\).*/\1/p' tests/e2e/up.sh)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: tests/e2e/standard-libs-fallback/${{ steps.libs.outputs.version }}
          key: standard-libs-${{ steps.libs.outputs.version }}-none
          restore-keys: standard-libs-${{ steps.libs.outputs.version }}-
      # docker.osgeo.org is slow from GitHub's runners (minutes for the GeoServer image): it comes from the cache
      - name: The GeoServer image's name
        id: image
        run: |
          v=$(sed -n 's/^export STANDARD_2_GEOSERVER_VERSION=\([^ ]*\).*/\1/p' tests/e2e/up.sh)
          echo "name=docker.osgeo.org/geoserver:$v" >> "$GITHUB_OUTPUT"
      - name: The GeoServer image, from the cache
        id: image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/geoserver-image.tar
          key: image-${{ steps.image.outputs.name }}
      - name: Load the GeoServer image
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: docker load -i ~/geoserver-image.tar
      - name: Start GeoServer 2.28 and PostGIS
        run: tests/e2e/up.sh standard-2
      - name: Keep the GeoServer image for the next run
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: docker save "${{ steps.image.outputs.name }}" -o ~/geoserver-image.tar
      - name: Save it in the cache
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/geoserver-image.tar
          key: image-${{ steps.image.outputs.name }}
      - name: e2e tests
        env:
          E2E_GEOSERVER_URL: http://localhost:59091/geoserver/rest
          E2E_SERVICES_URL: http://localhost:59091/geoserver
          E2E_GWC_URL: http://localhost:59091/geoserver/gwc/rest
          E2E_DB_PORT: '55433'
          E2E_DB_HOST_IN_GEOSERVER: db
          E2E_DATA_DIR: tests/e2e/data
          E2E_LDAP_URL: ldap://ldap:389
          E2E_REST_CONTAINER: gscloud-e2e-geoserver-1  # restarted by the caching defaults test; its log has the requests
        run: pytest -m e2e -v
      - name: Keep this run's extensions as the fallback copies
        run: tests/ci/keep-extensions.sh "${{ steps.libs.outputs.version }}"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: tests/e2e/standard-libs-fallback/${{ steps.libs.outputs.version }}
          key: standard-libs-${{ steps.libs.outputs.version }}-${{ hashFiles(format('tests/e2e/standard-libs-fallback/{0}/**', steps.libs.outputs.version)) }}
      - name: Logs on failure
        if: failure()
        run: docker logs gscloud-e2e-geoserver-1 2>&1 | tail -300
