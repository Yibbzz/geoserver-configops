name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.1
      - name: Helm lint
        run: helm lint .
      - name: Validate manifests against Kubernetes schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for extra in "" "-f values-local-registry.yaml" "--set ingest.enabled=false"; do
            echo "== helm template $extra"
            helm template geoserver . -f values.yaml $extra | ./kubeconform -strict -summary -kubernetes-version 1.34.0 -
          done
      - name: Shellcheck
        run: shellcheck *.sh tests/e2e/*.sh tests/kind/*.sh

  test:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_DB: gis
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install GDAL
        run: sudo apt-get update && sudo apt-get install -y gdal-bin
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: '5432'
          TEST_DB_NAME: gis
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres
        run: pytest

  ingest-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build ingest image
        run: docker build -t geoserver-ingest:ci auto-update-development
      - name: Smoke test
        run: |
          docker run --rm geoserver-ingest:ci python -c "import pipeline, sources.os_api"
          docker run --rm geoserver-ingest:ci ogr2ogr --version

  # The real GeoServer Cloud REST service (same images and jndi.yml as the chart) in Docker,
  # then the catalog import/export round trip against it.
  e2e-rest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Start GeoServer Cloud REST, PostGIS and RabbitMQ
        run: tests/e2e/up.sh
      - name: Round trip
        env:
          E2E_GEOSERVER_URL: http://localhost:59090/rest
          E2E_DB_PORT: '55433'
        run: pytest -m e2e -v
      - name: Logs on failure
        if: failure()
        run: docker compose -f tests/e2e/compose.yaml -p gscloud-e2e logs --tail=200

  # The whole chart on a throwaway kind cluster: every pod ready, OGC services through
  # the gateway, the round trip against the deployment, and a WMS GetMap.
  kind-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - uses: helm/kind-action@v1.15.2
        with:
          cluster_name: gscloud
      - name: Deploy and test
        run: tests/kind/deploy-test.sh
