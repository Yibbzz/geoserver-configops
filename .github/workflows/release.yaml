name: Release

# Push a tag like v0.2.0: the package goes to PyPI (geoserver-configops), the image to
# ghcr.io/<owner>/geoserver-configops, and both onto a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check the tag matches pyproject.toml's version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, pyproject.toml $version"; exit 1; }
      - name: Build
        run: pip install build && python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: package
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI's trusted publishing: no token kept in the repo
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3

  image:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build and push
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/geoserver-configops
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$image:${GITHUB_REF_NAME#v}" -t "$image:latest" .
          docker push "$image:${GITHUB_REF_NAME#v}"
          docker push "$image:latest"

  github:
    needs: [pypi, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
