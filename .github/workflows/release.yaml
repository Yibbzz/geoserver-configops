name: Release

# Push a tag like v0.2.0 (the version in pyproject.toml): the image goes to
# ghcr.io/<owner>/<repo name>, the package onto a GitHub release, and to PyPI once PyPI trusts
# this workflow (environment pypi); re-run the pypi job after setting that up.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.14'
      - name: Check the tag matches pyproject.toml's version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, pyproject.toml $version"; exit 1; }
      - name: Build
        run: pip install build && python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: package
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI's trusted publishing: no token kept in the repo
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  image:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Build and push
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/geoserver-configops
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$image:${GITHUB_REF_NAME#v}" -t "$image:latest" .
          docker push "$image:${GITHUB_REF_NAME#v}"
          docker push "$image:latest"

  github:
    needs: [package, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: dist
          path: dist/
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
